name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python files parse
        run: |
          python3 - <<'PY'
          import ast, pathlib
          for p in [*pathlib.Path("freecad").rglob("*.py"), *pathlib.Path("tools").rglob("*.py")]:
              ast.parse(p.read_text(encoding="utf-8"), str(p))
              print("ok", p)
          PY
      - name: Drawing sheets and sheet.py match the generator
        run: |
          python3 tools/build_templates.py
          git diff --exit-code -- freecad/
      - name: Translations list every text in the code
        run: python3 tools/update_translations.py --check
      - name: Manifest is valid XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('package.xml'); print('ok')"
      - name: Bandit security scan (the Addon Report's settings)
        run: |
          python3 -m pip install --quiet bandit==1.9.4
          bandit -q -c bandit.yaml -r .
